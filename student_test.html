lic colloid বলতে বোঝায়—", "o": ["dispersion medium-এর প্রতি বেশি আকর্ষণযুক্ত colloid", "medium-এর প্রতি কোনো আকর্ষণ নেই", "শুধু ধাতব colloid", "শুধু gas"]}, {"t": "Lyophilic/Lyophobic", "q": "Lyophobic colloid সাধারণত lyophilic colloid-এর তুলনায়—", "o": ["অধিক স্থিতিশীল", "কম স্থিতিশীল", "সবসময় true solution", "কোনো Tyndall effect দেয় না"]}, {"t": "Multimolecular colloid", "q": "Multimolecular colloid কীভাবে গঠিত হয়?", "o": ["অনেক ছোট atom/molecule একত্রিত হয়ে colloidal-size aggregate তৈরি করে", "একটি মাত্র বিশাল অণু দ্বারা", "শুধু ion দ্বারা", "শুধু gas bubble দ্বারা"]}, {"t": "Tyndall effect", "q": "Tyndall effect-এর কারণ—", "o": ["কলয়েড কণার দ্বারা আলোর scattering", "আলোর সম্পূর্ণ absorption", "শুধু reflection", "osmosis"]}, {"t": "Brownian movement", "q": "Brownian movement বলতে বোঝায়—", "o": ["কলয়েড কণার অনিয়মিত zig-zag গতি", "কণার স্থির থাকা", "শুধু নিচে বসে যাওয়া", "electric current"]}, {"t": "Electrophoresis", "q": "Electrophoresis-এ কী ঘটে?", "o": ["বিদ্যুৎক্ষেত্রে charged colloidal particles বিপরীত electrode-এর দিকে চলে", "solvent ফুটে যায়", "কণার আকার শূন্য হয়", "শুধু neutral gas তৈরি হয়"]}, {"t": "Coagulation", "q": "Colloidal solution-এ coagulation বলতে বোঝায়—", "o": ["colloidal particles-এর aggregation/precipitation", "দ্রাবকের evaporation মাত্র", "অণুর ionization", "boiling"]}, {"t": "Coagulation", "q": "Lyophobic sol-এ electrolyte যোগ করলে coagulation হওয়ার প্রধান কারণ—", "o": ["কণার charge neutralization", "তাপমাত্রা সবসময় 0°C হওয়া", "solvent বৃদ্ধি", "molecular mass শূন্য হওয়া"]}, {"t": "Emulsion", "q": "Emulsion হলো—", "o": ["এক তরল অন্য অমিশ্রণীয় তরলে dispersed থাকা colloidal system", "solid in gas", "gas in solid", "true solution only"]}, {"t": "Emulsion", "q": "Oil-in-water emulsion-এ dispersed phase কোনটি?", "o": ["জল", "তেল", "বায়ু", "কঠিন লবণ"]}, {"t": "Emulsion", "q": "Water-in-oil emulsion-এ dispersion medium কোনটি?", "o": ["জল", "তেল", "বায়ু", "কোনোটিই নয়"]}, {"t": "Emulsifier", "q": "Emulsifying agent-এর প্রধান কাজ কী?", "o": ["Emulsion-কে স্থিতিশীল করা", "সব তরলকে ফুটিয়ে তোলা", "হিমাঙ্ক বাড়ানো", "molar mass কমানো"]}, {"t": "বাষ্পচাপ", "q": "একই তাপমাত্রায় বিশুদ্ধ দ্রাবকের তুলনায় অউদ্বায়ী দ্রবযুক্ত দ্রবণের বাষ্পচাপ কম হওয়ার কারণ—", "o": ["পৃষ্ঠে দ্রাবক অণুর mole fraction কমে", "দ্রব অণু সবসময় বাষ্পীভূত হয়", "দ্রাবকের molar mass শূন্য হয়", "চাপের কোনো ভূমিকা নেই"]}, {"t": "Colligative property", "q": "Colligative property প্রধানত কোন বিষয়ের উপর নির্ভর করে?", "o": ["দ্রব কণার প্রকৃতির উপর", "দ্রব কণার সংখ্যার উপর", "দ্রবণের রঙের উপর", "পাত্রের আকৃতির উপর"]}, {"t": "Osmotic pressure numerical", "q": "একই T-তে দুটি dilute দ্রবণের molarity যথাক্রমে 0.10 M ও 0.20 M; non-electrolyte হলে কোনটির osmotic pressure বেশি?", "o": ["0.10 M", "0.20 M", "দুটির সমান", "কোনোটিই নয়"]}, {"t": "van't Hoff numerical", "q": "কোনো দ্রবের জন্য স্বাভাবিকভাবে ΔTf = 1.0 K হওয়ার কথা, কিন্তু observed ΔTf = 2.0 K। i কত?", "o": ["0.5", "1", "2", "4"]}, {"t": "সমন্বিত ধারণা", "q": "নিচের কোন জোড়াটি সঠিকভাবে মেলানো?", "o": ["Tyndall effect — আলোর scattering", "Brownian movement — osmosis", "Electrophoresis — boiling", "Coagulation — vapour pressure বৃদ্ধি"]}];
let attemptRef=null,startMs=null,timer=null,answers={};

const form=document.getElementById("form");
form.innerHTML=QUESTIONS.map((x,i)=>`<div class="q"><div class="topic">${x.t}</div><b>${i+1}. ${x.q}</b>${x.o.map((op,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${op}</label>`).join("")}</div>`).join("");

function updateStatus(){
 const n=Object.keys(answers).length;
 const secs=startMs?Math.floor((Date.now()-startMs)/1000):0;
 document.getElementById("status").textContent=`${n} / ${QUESTIONS.length} answered · ${String(Math.floor(secs/60)).padStart(2,"0")}:${String(secs%60).padStart(2,"0")}`;
 document.getElementById("fill").style.width=(n/QUESTIONS.length*100)+"%";
}
document.getElementById("startBtn").onclick=async()=>{
 const name=document.getElementById("name").value.trim(), roll=document.getElementById("roll").value.trim();
 if(!name)return alert("নাম লিখুন।");
 try{
  document.getElementById("msg").textContent="Connecting...";
  const cred=await signInAnonymously(auth);
  const attemptId=crypto.randomUUID();
  attemptRef=doc(db,"attempts",attemptId);
  await setDoc(attemptRef,{studentUid:cred.user.uid,studentName:name,roll:roll||"",testId:TEST_ID,status:"in_progress",progress:0,answers:{},startedAt:serverTimestamp(),lastUpdated:serverTimestamp()});
  startMs=Date.now(); timer=setInterval(updateStatus,1000);
  document.getElementById("startCard").classList.add("hidden");document.getElementById("test").classList.remove("hidden");
 }catch(e){document.getElementById("msg").textContent="Connection failed: "+e.message;}
};
form.addEventListener("change",async(e)=>{
 if(!attemptRef||e.target.type!=="radio")return;
 answers[e.target.name]=Number(e.target.value); updateStatus();
 try{await updateDoc(attemptRef,{answers,progress:Object.keys(answers).length,lastUpdated:serverTimestamp()});}catch(err){console.error(err);}
});
document.getElementById("submitBtn").onclick=async()=>{
 if(!attemptRef)return;
 const unanswered=QUESTIONS.length-Object.keys(answers).length;
 if(unanswered>0&&!confirm(`${unanswered}টি প্রশ্ন unanswered. তবুও submit করবে?`))return;
 if(!confirm("Final submit করতে নিশ্চিত?"))return;
 clearInterval(timer);
 const durationSeconds=Math.floor((Date.now()-startMs)/1000);
 await updateDoc(attemptRef,{status:"submitted",progress:Object.keys(answers).length,answers,durationSeconds,submittedAt:serverTimestamp(),lastUpdated:serverTimestamp()});
 document.getElementById("test").classList.add("hidden");document.getElementById("done").classList.remove("hidden");
};
